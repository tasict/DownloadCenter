# Deploys the product site (site/) to GitHub Pages together with updates.json,
# the index of published releases that the site and the in-app updater read,
# and trackers.json, the public tracker list Download Center offers for
# torrents that find no peers. Runs when the site changes, after every
# release, once a day (to refresh the tracker list) and on demand.
name: Pages

on:
  push:
    branches: [master]
    paths: ['site/**', '.github/workflows/pages.yml']
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
  workflow_run:
    workflows: [Release]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # after a release only when it was published
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    # configure-pages reads the Pages settings; writing is left to deploy
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: daemon/go.mod
          cache-dependency-path: daemon/go.sum

      - name: Site and update feed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p _site
          if [ -d site ]; then cp -R site/. _site/; fi
          rm -f _site/updates.sample.json
          (cd daemon && go run ./cmd/dcrelease feed -repo "$GITHUB_REPOSITORY" -pub ../tools/release-key.pub -out ../_site/updates.json)
          # newTrackon's stable trackers; if that fails the published list stays
          (cd daemon && go run ./cmd/dcrelease trackers -out ../_site/trackers.json -prev https://tasict.github.io/DownloadCenter/trackers.json)

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # only the job that deploys may write to Pages
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
