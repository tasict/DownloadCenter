# Checks every push and pull request: Go vet and tests, JavaScript syntax
# (the UI is ES5 without a build step) and shell syntax. Packages are built
# on the build NAS, not here.
name: Checks

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: daemon/go.mod
          cache-dependency-path: daemon/go.sum

      - name: Go
        working-directory: daemon
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; echo "run gofmt"; exit 1; }
          go vet ./...
          go test ./...

      - name: JavaScript
        run: for f in shared/web/js/*.js shared/web/js/lang/*.js; do node --check "$f"; done

      - name: Shell
        run: for f in build.sh shared/DownloadCenter.sh tools/*.sh; do sh -n "$f"; done
