# Name of the packaged application.
QPKG_NAME="DownloadCenter"
# Name displayed in QTS
QPKG_DISPLAY_NAME="Download Center"
# Version of the packaged application.
QPKG_VER="1.0.0"
# Author or maintainer of the package
QPKG_AUTHOR="tasict"
# One-line description of the packaged application
QPKG_SUMMARY="Download HTTP/HTTPS/FTP links, torrents and magnet links; an alternative to QNAP Download Station, not affiliated with QNAP"

# Preferred number in start/stop sequence.
QPKG_RC_NUM="110"
# Init-script used to control the start and stop of the installed application.
QPKG_SERVICE_PROGRAM="DownloadCenter.sh"

# Relative path to web interface
QPKG_WEBUI="/DownloadCenter/"
# Served by the QTS admin Apache (8080/443), not on a port of its own
QPKG_WEB_PORT="-1"
# Do not use QTS automatic reverse proxy
QPKG_USE_PROXY="0"
# Open the web interface inside the QTS desktop
QPKG_DESKTOP_APP="1"
QPKG_DESKTOP_APP_WIN_WIDTH="1100"
QPKG_DESKTOP_APP_WIN_HEIGHT="720"
# Show the app to every NAS user; the package keeps its own user list
QPKG_VISIBLE="2"
# Give the daemon time to save the download session on stop
QPKG_TIMEOUT="30,60"

# Location of icons for the packaged application.
QDK_DATA_DIR_ICONS="icons"
# Per-architecture binaries (dcd, dc-dl, dc-bt)
QDK_DATA_DIR_X86_64="x86_64"
QDK_DATA_DIR_ARM_64="arm_64"
QDK_DATA_DIR_X41="arm-x41"
QDK_DATA_DIR_X31="arm-x31"
# Location of files common to all architectures.
QDK_DATA_DIR_SHARED="shared"
